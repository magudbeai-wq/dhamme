<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Charcoal Background -->
  <rect width="100" height="100" rx="22" fill="#111315" />
  
  <!-- Outer Gold Diamond Frame -->
  <rect 
    x="50" 
    y="14" 
    width="51" 
    height="51" 
    rx="7" 
    transform="rotate(45 50 14)" 
    stroke="#C8A96B" 
    stroke-width="7.5" 
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  
  <!-- Inner Pure White Diamond -->
  <rect 
    x="50" 
    y="34" 
    width="23" 
    height="23" 
    rx="3.5" 
    transform="rotate(45 50 34)" 
    fill="#FFFFFF" 
  />
</svg>